name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT NOTES:
#
# 1. GitHub Pages (this workflow) — deploys the React SPA + static HTML pages.
#    The Firebase SDK keys for the SPA are set as GitHub Secrets:
#    VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, etc.
#
# 2. Firebase Cloud Functions (separate deployment) — run manually:
#    cd functions && npm install
#    firebase deploy --only functions
#    firebase functions:secrets:set YOUTUBE_API_KEY_ENCRYPTION_SECRET
#
#    The Cloud Functions provide:
#    - youtubeFeed: fetches real-time YouTube videos (views, likes, thumbnails)
#      using each creator's encrypted API key stored in Firestore.
#    - storeCreatorApiKey: encrypts and stores the creator's YouTube API key
#      server-side so it's never exposed in client code.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_YT_PROXY_URL: ${{ secrets.VITE_YT_PROXY_URL }}

      - name: Copy static HTML pages into dist
        run: |
          cp viewers.html dist/viewers.html
          cp creators.html dist/creators.html
          cp about.html dist/about.html
          cp directory.html dist/directory.html
          cp admin.html dist/admin.html
          cp creator-profile.html dist/creator-profile.html
          cp style.css dist/style.css

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
